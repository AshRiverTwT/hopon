<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HopOn trailer scenes</title>
<!-- Dev-only (marketing/trailer): intro, comparison and outro scenes.
     ?scene=intro|compare|outro ; compare: &hl=<launch s>&dl=<launch s>&hm=<MB>&dm=<MB>[&draft] -->
<style>
@font-face { font-family: "Archivo"; src: url("/src/fonts/archivo-wdth.woff2") format("woff2-variations"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Geist Mono"; src: url("/src/fonts/geist-mono.woff2") format("woff2-variations"); font-weight: 100 900; }
@font-face { font-family: "Geist"; src: url("/src/fonts/geist.woff2") format("woff2-variations"); font-weight: 100 900; }
:root { --ink: #0b0b0c; --cream: #ededee; --signal: #ff5b1f; --dim: rgba(237,237,238,.35); --hair: rgba(255,255,255,.09); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; background: var(--ink); color: var(--cream); overflow: hidden; font-family: "Geist", sans-serif; }
.stage { position: absolute; inset: 0; }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.4px); background-size: 12px 12px;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, transparent 62%); opacity: 0; animation: fade 1.6s .2s ease forwards; }
.corners { position: absolute; inset: 14px; --m: rgba(237,237,238,.35); opacity: 0; animation: fade .8s .3s ease forwards;
  background:
    linear-gradient(var(--m),var(--m)) left top/18px 1px no-repeat, linear-gradient(var(--m),var(--m)) left top/1px 18px no-repeat,
    linear-gradient(var(--m),var(--m)) right top/18px 1px no-repeat, linear-gradient(var(--m),var(--m)) right top/1px 18px no-repeat,
    linear-gradient(var(--m),var(--m)) left bottom/18px 1px no-repeat, linear-gradient(var(--m),var(--m)) left bottom/1px 18px no-repeat,
    linear-gradient(var(--m),var(--m)) right bottom/18px 1px no-repeat, linear-gradient(var(--m),var(--m)) right bottom/1px 18px no-repeat; }
@keyframes fade { to { opacity: 1; } }

/* the step H, built from three pieces (viewBox 0 0 512 512 geometry) */
.mark { position: absolute; width: 300px; height: 300px; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.mark i { position: absolute; display: block; }
.legL { left: 19.5%; top: 31.25%; width: 18.75%; height: 50%; background: var(--cream); }
.legR { left: 61.7%; top: 18.75%; width: 18.75%; height: 50%; background: var(--cream); }
.bar  { left: 38.25%; top: 44.5%; width: 23.45%; height: 12.5%; background: var(--signal); transform-origin: 0 50%; box-shadow: 0 0 30px rgba(255,91,31,.55); }
.intro .legL { animation: rise .7s cubic-bezier(.2,.9,.2,1) both; }
.intro .legR { animation: hop .9s .35s cubic-bezier(.3,1.5,.4,1) both; }
.intro .bar  { animation: grow .38s 1.05s cubic-bezier(.2,.9,.2,1) both; }
@keyframes rise { from { transform: translateY(70%); opacity: 0; } }
@keyframes hop { 0% { transform: translateY(80%); opacity: 0; } 35% { opacity: 1; } 60% { transform: translateY(-18%); } 100% { transform: none; } }
@keyframes grow { from { transform: scaleX(0); } }
.intro .mark { animation: slide .7s 1.7s cubic-bezier(.2,.9,.2,1) both; }
@keyframes slide { to { transform: translate(var(--mx), -50%) scale(.5); } }
.word { position: absolute; left: 50%; top: 50%; transform: translate(-42%, -50%); font-family: "Archivo"; font-weight: 900; font-stretch: 125%;
  font-size: 150px; letter-spacing: .01em; text-transform: uppercase; line-height: .9; clip-path: inset(0 100% 0 0); }
.intro .word { font-size: 104px; transform: translate(var(--wx), -50%); animation: reveal .7s 1.85s cubic-bezier(.2,.9,.2,1) forwards; }
@keyframes reveal { to { clip-path: inset(0 0 0 0); } }

/* comparison: two instrument scales per measure */
.compare { display: grid; place-items: center; zoom: .6667; }
.grid { width: 1500px; display: grid; gap: 92px; }
.row { display: grid; gap: 26px; opacity: 0; animation: fade .5s ease forwards; }
.row:nth-child(2) { animation-delay: 2.2s; }
.label { font-family: "Geist Mono"; font-size: 22px; letter-spacing: .3em; color: var(--dim); }
.meter { display: grid; grid-template-columns: 220px 1fr 260px; align-items: center; gap: 36px; }
.who { font-family: "Archivo"; font-weight: 900; font-stretch: 125%; font-size: 34px; text-transform: uppercase; }
.who.them { color: var(--dim); }
.scale { position: relative; height: 54px; }
.scale svg { width: 100%; height: 100%; display: block; }
.val { font-family: "Geist Mono"; font-size: 46px; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.val small { font-size: 22px; color: var(--dim); margin-left: 8px; letter-spacing: .1em; }
.val.them { color: var(--dim); }
.draft { position: absolute; right: 30px; bottom: 26px; font-family: "Geist Mono"; font-size: 16px; letter-spacing: .2em; color: var(--signal); }

/* outro */
.outro .mark { width: 220px; height: 220px; top: 44%; }
.outro .legL { animation: rise .6s cubic-bezier(.2,.9,.2,1) both; }
.outro .legR { animation: hop .8s .2s cubic-bezier(.3,1.5,.4,1) both; }
.outro .bar { animation: grow .35s .8s cubic-bezier(.2,.9,.2,1) both, pulse 1.2s 1.4s ease-in-out both; }
@keyframes pulse { 50% { box-shadow: 0 0 60px rgba(255,91,31,.9); } }
.outro .word { top: 70%; font-size: 64px; transform: translate(-50%, -50%); animation: reveal .6s 1.1s cubic-bezier(.2,.9,.2,1) forwards; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const scene = q.get("scene") || "intro";
const stage = document.getElementById("stage");
const MARK = '<div class="mark"><i class="legL"></i><i class="legR"></i><i class="bar"></i></div>';
const FRAME = '<div class="dots"></div><div class="corners"></div>';
if (scene === "intro") {
  stage.className = "stage intro"; stage.innerHTML = FRAME + MARK + '<div class="word">HopOn</div>';
  // Final layout: [mark][gap][HOPON], centred as a group.
  const word = stage.querySelector(".word"); const mark = 300 * 0.5, gap = 44;
  document.fonts.ready.then(() => {
  const ww = word.getBoundingClientRect().width, total = mark + gap + ww;
  const left = -total / 2; // group's left edge, relative to the centre
  // .mark is translated by -50% of its own 300px box; scale(.5) keeps its centre.
  stage.style.setProperty("--mx", `${left + mark / 2 - 150}px`);
  stage.style.setProperty("--wx", `${left + mark + gap}px`);
  });
}
if (scene === "outro") { stage.className = "stage outro"; stage.innerHTML = FRAME + MARK + '<div class="word">HopOn</div>'; }
if (scene === "compare") {
  stage.className = "stage compare";
  const n = (k) => Number(q.get(k));
  const rows = [
    { label: "LAUNCH", unit: "s", us: n("hl"), them: n("dl"), fmt: (v) => v.toFixed(2) },
    { label: "MEMORY", unit: "MB", us: n("hm"), them: n("dm"), fmt: (v) => Math.round(v).toString() },
  ];
  const TICKS = 120;
  const scaleSvg = (id) => {
    let s = `<svg viewBox="0 0 ${TICKS * 10} 54" preserveAspectRatio="none" id="${id}">`;
    for (let i = 0; i < TICKS; i++) s += `<rect x="${i * 10}" y="${i % 10 === 0 ? 0 : 14}" width="3" height="${i % 10 === 0 ? 54 : 40}" fill="rgba(237,237,238,.13)"/>`;
    return s + "</svg>";
  };
  stage.innerHTML = FRAME + `<div class="grid">${rows.map((r, i) => `
    <div class="row"><div class="label">${r.label}</div>
      <div class="meter"><div class="who">HopOn</div><div class="scale">${scaleSvg(`s${i}u`)}</div><div class="val" id="v${i}u">0<small>${r.unit}</small></div></div>
      <div class="meter"><div class="who them">Discord</div><div class="scale">${scaleSvg(`s${i}t`)}</div><div class="val them" id="v${i}t">0<small>${r.unit}</small></div></div>
    </div>`).join("")}</div>` + (q.has("draft") ? '<div class="draft">DRAFT · NUMBERS PENDING</div>' : "");
  // Bars fill tick by tick on the document timeline (which recording slows down).
  const ease = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
  const start = [0.5, 2.6]; // seconds: row 1, row 2
  const tick = () => {
    const now = (document.timeline.currentTime || 0) / 1000;
    rows.forEach((r, i) => {
      const max = Math.max(r.us, r.them) * 1.08 || 1;
      for (const [who, val, lit] of [["u", r.us, "#ff5b1f"], ["t", r.them, "rgba(237,237,238,.55)"]]) {
        // Time to fill is proportional to the value: the faster app finishes first.
        const dur = 0.25 + 1.5 * (val / max);
        const p = ease((now - start[i]) / dur);
        const shown = val * p;
        const lit_n = Math.round((shown / max) * TICKS);
        const rects = document.querySelectorAll(`#s${i}${who} rect`);
        rects.forEach((el, k) => el.setAttribute("fill", k < lit_n ? lit : "rgba(237,237,238,.13)"));
        document.getElementById(`v${i}${who}`).firstChild.nodeValue = r.fmt(shown);
      }
    });
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
