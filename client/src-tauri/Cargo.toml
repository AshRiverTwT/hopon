[package]
name = "hopon-client"
version.workspace = true
edition.workspace = true
description = "HopOn desktop client"

[lib]
name = "hopon_client_lib"
crate-type = ["rlib"]

[[bin]]
name = "hopon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Connection, state, cache and voice: everything that isn't the webview shell.
hopon-core = { path = "../core", default-features = false }
hopon-shared.workspace = true
serde.workspace = true
serde_json = "1"
tokio.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "compression", "unstable", "tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Desktop notifications over D-Bus (pure Rust).
notify-rust = { version = "4", default-features = false, features = ["z"] }
# Switch on WebRTC / camera / screen capture in the Linux webview (same version Tauri uses).
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
# Message notifications (Windows toasts); the same crate Tauri's notification plugin uses.
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_Media",
] }

[features]
default = ["voice"]
# Off only for headless text-path testing on hosts without a libwebrtc toolchain.
voice = ["hopon-core/voice"]
# Passed by `tauri build`; keeps devtools/dev server out of release.
custom-protocol = ["tauri/custom-protocol"]
