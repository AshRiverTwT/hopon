[package]
name = "hopon-client"
version.workspace = true
edition.workspace = true
description = "HopOn desktop client"

[lib]
name = "hopon_client_lib"
crate-type = ["rlib"]

[[bin]]
name = "hopon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hopon-shared.workspace = true
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
futures-util.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
base64 = "0.22"
# File uploads (already in the graph through the LiveKit SDK).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
# TLS for wss:// (chat). Must name a crypto provider explicitly: the copy
# of rustls with `ring` in the graph is a build-script dependency only.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "compression", "unstable"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Voice: LiveKit SDK with libwebrtc's platform ADM (WASAPI on Windows).
# TLS for wss:// SFU signaling (off by default in the SDK).
livekit = { version = "0.10", optional = true, features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_Media",
] }

[features]
default = ["voice"]
# Off only for headless text-path testing on hosts without a libwebrtc toolchain.
voice = ["dep:livekit"]
# Passed by `tauri build`; keeps devtools/dev server out of release.
custom-protocol = ["tauri/custom-protocol"]
