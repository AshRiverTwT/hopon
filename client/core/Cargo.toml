[package]
name = "hopon-core"
version.workspace = true
edition.workspace = true
description = "HopOn client core: connection, state, cache and voice. No UI toolkit."

[dependencies]
hopon-shared.workspace = true
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
futures-util.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
base64 = "0.22"
sha2 = "0.10"
# File uploads (already in the graph through the LiveKit SDK).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
tracing.workspace = true
# TLS for wss:// (chat). Must name a crypto provider explicitly: the copy
# of rustls with `ring` in the graph is a build-script dependency only.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Voice: LiveKit SDK with libwebrtc's platform ADM (WASAPI on Windows).
# TLS for wss:// SFU signaling (off by default in the SDK).
livekit = { version = "0.10", optional = true, features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
] }

[features]
default = ["voice"]
# Off only for headless text-path testing on hosts without a libwebrtc toolchain.
voice = ["dep:livekit"]
