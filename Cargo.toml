[workspace]
resolver = "2"
members = ["shared", "server", "bench", "client/src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hdrhistogram = { version = "7.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
parking_lot = "0.12"
hopon-shared = { path = "shared" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Fast iteration for dev builds of heavy deps.
[profile.dev.package."*"]
opt-level = 2

# Per-person voice volume needs one call LiveKit's SDK doesn't expose yet
# (see vendor/README.md).
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
libwebrtc = { path = "vendor/libwebrtc" }
