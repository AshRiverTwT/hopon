# Native WinUI port: build and check on real Windows.
# - build: hopon_ffi.dll (with voice), hopon-server and e2e_feed; model tests.
# - bridge: Postgres + server on the runner; the C# end-to-end check through
#   the DLL (JIT and Native AOT).
# - app: the WinUI app, built, published with Native AOT, run against the
#   server and measured (startup, paint latency, idle CPU/RAM, size, screenshot).
name: windows-native

on:
  push:
    branches: ["claude/**"]
    paths:
      - "client/core/**"
      - "client/ffi/**"
      - "client/native/**"
      - "shared/**"
      - "server/**"
      - "bench/**"
      - "vendor/**"
      - "scripts/ci/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-native.yml"
  workflow_dispatch:

concurrency:
  group: windows-native-${{ github.ref }}
  # Queue, don't cancel: a cancelled run loses its Rust build cache.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Note: on Windows runners a process started in one step is killed when that
  # step ends, so each step that needs the server starts it itself.
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The Rust binaries only change when a Rust input does: most pushes are
      # C#-only, so reuse the last build of the same inputs (saves ~20 min).
      - name: Reuse built binaries
        id: bins
        uses: actions/cache@v4
        with:
          path: |
            target/debug/hopon_ffi.dll
            target/debug/hopon-server.exe
            target/debug/e2e_feed.exe
            target/debug/screen_loopback.exe
            target/ship/hopon_ffi.dll
          key: rust-bins-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'client/core/**', 'client/ffi/src/**', 'client/ffi/build.rs', 'client/ffi/Cargo.toml', 'shared/**', 'server/**', 'bench/**', 'vendor/**') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.bins.outputs.cache-hit != 'true'
        with:
          shared-key: windows-native
          cache-on-failure: true
          # vendor/webrtc-sys is a path dependency: without this its C++ build
          # (most of the build time) is thrown away and redone every run.
          cache-workspace-crates: true

      - name: Build hopon_ffi.dll (voice), hopon-server, e2e_feed
        if: steps.bins.outputs.cache-hit != 'true'
        # Two commands: `--bin` applies to every package in a command, so one
        # combined build would skip the hopon-server binary.
        run: |
          cargo build -p hopon-ffi -p hopon-server
          cargo build -p hopon-bench --bin e2e_feed
          cargo build -p hopon-bench --features voice --bin screen_loopback

      - name: Build the release hopon_ffi.dll (what ships with the app)
        if: steps.bins.outputs.cache-hit != 'true'
        run: |
          cargo build --release -p hopon-ffi
          New-Item -ItemType Directory -Force target\ship | Out-Null
          Copy-Item target\release\hopon_ffi.dll target\ship\

      - name: C# bindings are current
        if: steps.bins.outputs.cache-hit != 'true'
        shell: bash
        run: git diff --exit-code client/ffi/bindings/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-bin
          path: |
            target/debug/hopon_ffi.dll
            target/debug/hopon-server.exe
            target/debug/e2e_feed.exe
            target/debug/screen_loopback.exe
            target/ship/hopon_ffi.dll
          retention-days: 7

      - name: Model tests (C# models vs Rust fixtures, merge, formatting, polls)
        shell: pwsh
        working-directory: client/native/HopOn.Interop.Tests
        run: |
          dotnet build -c Debug -warnaserror
          dotnet bin\Debug\net10.0\HopOn.Interop.Tests.dll
          if ($LASTEXITCODE -ne 0) { throw "model tests failed" }

  # Screen share through a real LiveKit SFU, headless: capture the runner's
  # desktop, publish, subscribe from a second participant; per codec, which
  # encoder/decoder this libwebrtc build uses and what arrives.
  screen:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rust-bin
          path: ${{ runner.temp }}\rust-bin

      - name: Screen share loopback (VP8, H.264)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\ci\start-livekit.ps1"
          $exe = "$env:RUNNER_TEMP\rust-bin\debug\screen_loopback.exe"
          $env:RUST_LOG = "info,libwebrtc=info"
          $failed = @()
          foreach ($run in @(@("vp8", "1920", "1080", "30"), @("vp8", "1280", "720", "60"), @("h264", "1920", "1080", "30"))) {
            Write-Host "=== $($run -join ' ') ==="
            $p = Start-Process $exe -ArgumentList "--codec", $run[0], "--width", $run[1], "--height", $run[2], "--fps", $run[3], "--secs", "12", "--secret", "secret" `
              -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
            $p.WaitForExit()
            $cpu = $p.TotalProcessorTime.TotalSeconds
            Get-Content "$env:RUNNER_TEMP\out.txt"
            Get-Content "$env:RUNNER_TEMP\err.txt" | Select-String -Pattern "error|warn|H264|h264|decoder|encoder|capturer|WGC|DXGI" | Select-Object -First 40
            Write-Host "exit $($p.ExitCode); process CPU $([math]::Round($cpu, 1)) s over ~14 s (both participants, one process)"
            $line = Get-Content "$env:RUNNER_TEMP\out.txt" | Where-Object { $_ -like "RESULT *" }
            if ($line) { "| $($run -join ' ') | ``$($line.Substring(7))`` | $([math]::Round($cpu, 1)) s |" >> $env:GITHUB_STEP_SUMMARY }
            if ($p.ExitCode -ne 0 -and $run[0] -eq "vp8") { $failed += ($run -join ' ') }
          }
          if ($failed.Count) { throw "screen loopback failed: $($failed -join ', ')" }

  bridge:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: rust-bin
          path: ${{ runner.temp }}\rust-bin

      - name: Bridge check (C# -> hopon_ffi.dll -> server), JIT and Native AOT
        shell: pwsh
        working-directory: client/native/HopOn.BridgeCheck
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\ci\start-server.ps1" -ServerExe "$env:RUNNER_TEMP\rust-bin\debug\hopon-server.exe"
          $env:HOPON_URL = "ws://127.0.0.1:18080/ws"
          $env:RUST_LOG = "info,livekit=warn,libwebrtc=warn"
          dotnet build -c Debug -warnaserror
          Copy-Item "$env:RUNNER_TEMP\rust-bin\debug\hopon_ffi.dll" bin\Debug\net10.0\
          dotnet bin\Debug\net10.0\HopOn.BridgeCheck.dll owner "$env:RUNNER_TEMP\bridge"
          if ($LASTEXITCODE -ne 0) { throw "bridge check failed ($LASTEXITCODE)" }
          dotnet publish -c Release -r win-x64 -p:PublishAot=true -o "$env:RUNNER_TEMP\aot"
          Copy-Item "$env:RUNNER_TEMP\rust-bin\debug\hopon_ffi.dll" "$env:RUNNER_TEMP\aot\"
          & "$env:RUNNER_TEMP\aot\HopOn.BridgeCheck.exe" owner "$env:RUNNER_TEMP\bridge-aot"
          if ($LASTEXITCODE -ne 0) { throw "AOT bridge check failed ($LASTEXITCODE)" }

      - name: Server log
        if: always()
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP\logs\server.err.log" -ErrorAction SilentlyContinue | Select-Object -Last 50

  app:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: rust-bin
          path: ${{ runner.temp }}\rust-bin

      - name: Build the WinUI app
        shell: pwsh
        working-directory: client/native/HopOn.App
        run: dotnet build -c Debug -p:HoponFfiDll="$env:RUNNER_TEMP\rust-bin\debug\hopon_ffi.dll"

      - name: Publish (self-contained, Native AOT)
        shell: pwsh
        working-directory: client/native/HopOn.App
        run: |
          dotnet publish -c Release -p:HoponFfiDll="$env:RUNNER_TEMP\rust-bin\ship\hopon_ffi.dll" -o "$env:RUNNER_TEMP\HopOn"
          Get-ChildItem "$env:RUNNER_TEMP\HopOn" | Sort-Object Length -Descending | Select-Object -First 15 | Format-Table Name, Length

      - name: Run and measure the app (against a server on the runner)
        shell: pwsh
        run: |
          scripts\ci\start-server.ps1 -ServerExe "$env:RUNNER_TEMP\rust-bin\debug\hopon-server.exe"
          scripts\ci\measure-app.ps1 -AppDir "$env:RUNNER_TEMP\HopOn" -E2eFeed "$env:RUNNER_TEMP\rust-bin\debug\e2e_feed.exe" -Out "$env:RUNNER_TEMP\results"

      - name: Installer (build, then install / start / uninstall)
        shell: pwsh
        run: scripts\ci\installer.ps1 -AppDir "$env:RUNNER_TEMP\HopOn" -OutDir "$env:RUNNER_TEMP\installer"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: HopOn-native-setup
          path: ${{ runner.temp }}\installer\*.exe
          retention-days: 30

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-app-results
          path: ${{ runner.temp }}\results
          retention-days: 14

      - name: Upload the app (release build; for trying it out)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HopOn-native-preview
          path: ${{ runner.temp }}\HopOn
          retention-days: 14
