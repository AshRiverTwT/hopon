[package]
name = "hopon-bench"
version.workspace = true
edition.workspace = true

[features]
default = []
# The voice benchmarks pull in libwebrtc via the LiveKit SDK.
voice = ["dep:livekit", "dep:jsonwebtoken"]

[dependencies]
hopon-shared.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures-util.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
rand = "0.8"
livekit = { version = "0.10", optional = true }
jsonwebtoken = { version = "9", optional = true }

[[bin]]
name = "msg_rtt"
path = "src/bin/msg_rtt.rs"

[[bin]]
name = "e2e_feed"
path = "src/bin/e2e_feed.rs"

[[bin]]
name = "voice_grant_check"
path = "src/bin/voice_grant_check.rs"

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "voice_loopback"
path = "src/bin/voice_loopback.rs"
required-features = ["voice"]
