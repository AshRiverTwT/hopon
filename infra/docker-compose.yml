# Single-region deployment: chat server + Postgres + LiveKit + coturn.
#   cp infra/.env.example infra/.env && $EDITOR infra/.env
#   infra/render-config.sh
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
# LiveKit and coturn use host networking: no NAT hop on the UDP media path.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hopon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hopon
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopon"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  server:
    build: { context: .., dockerfile: infra/Dockerfile.server }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://hopon:${POSTGRES_PASSWORD}@postgres/hopon
      HOPON_JWT_SECRET: ${HOPON_JWT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      RUST_LOG: info
    ports: ["8080:8080"]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.11
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./generated/livekit.yaml:/etc/livekit.yaml:ro"]
    restart: unless-stopped

  coturn:
    image: coturn/coturn@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3  # 4.18.0
    network_mode: host
    command: ["-c", "/etc/turnserver.conf"]
    volumes: ["./generated/turnserver.conf:/etc/turnserver.conf:ro"]
    restart: unless-stopped

volumes:
  pgdata:
